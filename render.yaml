services:
  - type: web
    name: traillens
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: AI_PROVIDER
        value: demo
      - key: OPEN_MODEL_NAME
        value: google/gemma-2-2b-it
      - key: VISION_MODEL_NAME
        value: google/paligemma-3b-pt-224
      - key: OPEN_MODEL_LICENSE
        value: Gemma Open Weights Terms of Use
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: traillens
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 1.0
